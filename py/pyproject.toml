[project]
name = "tinyhvm"
version = "0.1.0"
description = "Python bindings for TinyHVM — interaction net tensor runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinyhvm*"]
